# Free Supabase projects are paused after ~7 days without activity. pg_cron runs inside the
# database and may not count as activity, so make one cheap external API request per day.
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (public key, RLS applies).
name: Supabase keepalive
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/shops?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          test "$code" = "200"
