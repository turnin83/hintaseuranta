name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Parser + rule tests
        run: npm test
      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/fetch-prices/index.ts supabase/functions/preview-product/index.ts supabase/functions/push-test/index.ts supabase/functions/probe/index.ts
      - name: Build web
        working-directory: web
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci
